# Pinned so the data volume is always spotifydatapipeline_pgdata, whatever this folder is called or moves to.
# Without it Compose derives the project (and so the volume) name from the folder name, and moving the folder
# would silently point it at a new, empty volume.
name: spotifydatapipeline

services:
  postgres:
    image: postgres:16
    container_name: spotify_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spotify_user
      POSTGRES_PASSWORD: spotify_pass
      POSTGRES_DB: spotify_data
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:
